id: cross_scan_rare_technology
version: '1'
meta:
  name: Rare technology across scans
  description: 'A web technology or software stack that appears in only one scan (or
    a very small percentage of scans) may indicate a unique, legacy, or high-risk
    system.

    '
  risk: MEDIUM
  scope: workspace
collections:
- id: cross_scan_rare_technology_collection
  name: Rare technology across scans
  condition:
    collect:
    - method: exact
      field: type
      value: WEBSERVER_TECHNOLOGY
aggregation:
  field: data
analysis:
- method: outlier
  maximum_percent: 10
headline: Rare technology {data} found in only one scan or a small subset of scans
