id: root_path_needs_auth
version: '1'
meta:
  name: Website root path needs authentication
  description: 'The base path of a server needs authentication, indicating the server
    is likely sensitive or important.

    '
  risk: INFO
collections:
- id: root_path_needs_auth_collection
  name: Website root path needs authentication
  condition:
    collect:
    - method: exact
      field: type
      value: HTTP_CODE
    - method: regex
      field: data
      value: 40[31]
    - method: regex
      field: source.data
      value:
      - ^https?://[a-zA-Z0-9\.\-]+/?#?$
      - ^[a-zA-Z0-9\.\-]+$
aggregation:
  field: source.data
headline: 'Base URL requires authentication: {source.data}'
