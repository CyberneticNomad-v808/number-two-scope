id: stale_host
version: '1'
meta:
  name: Stale host found
  description: 'A host appears to be stale based upon various indicators such as unsuccessful
    HTTP codes, expired SSL certificates, error messages, vulnerabilities and junk
    files found. Such hosts may be unmaintained, exposing the target to security risks.

    '
  risk: HIGH
collections:
- id: stale_host_collection
  name: Stale host found
  condition:
    collect:
    - method: regex
      field: type
      value: VULNERABILITY_.*
aggregation:
  field: entity.data
analysis:
- method: threshold
  field: type
  count_unique_only: true
  minimum: 3
headline: 'Potentially stale/unmaintained host: {entity.data}'
