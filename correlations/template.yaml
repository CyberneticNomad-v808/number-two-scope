id: set_a_meaningful_id_here
version: '1'
meta:
  name: This is a briefly descriptive name.
  description: 'This is a more detailed description about the rule and ideally includes
    some rationale explaining the risk posed, or other relevant information that helps
    the user better understand the value of the rule results.

    You can have multiple paragraphs here too.

    For this example rule, our goal is to find all hosts that match "foo" or "bar",
    creating a correlation result when such a host is found more than once.

    '
  risk: MEDIUM
collections:
- id: set_a_meaningful_id_here_collection
  name: This is a briefly descriptive name.
  condition:
    collect:
    - method: exact
      field: type
      value: INTERNET_NAME
    - method: regex
      field: data
      value:
      - .*foo.*
      - .*bar.*
aggregation:
  field: data
analysis:
- method: threshold
  minimum: 2
  field: data
headline: 'A foo or bar host was found more than once: {data}'
