[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = test

# Output configuration
addopts =
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --timeout=30
    --timeout-method=thread
    -n 16
    --dist loadfile
    --cov=spiderfoot
    --cov=modules
    --cov-report=html
    --cov-report=xml
    --cov-report=term

# Markers
markers =
    unit: Unit tests
    integration: Integration tests  
    regression: Regression tests
    slow: Slow running tests
    requires_db: Tests that require database connection
    requires_api: Tests that require external API access
    timeout: Tests with timeout constraints

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if using pytest-cov)
[coverage:run]
source = spiderfoot
omit = 
    */tests/*
    */test/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
