# SonarQube Project Configuration
sonar.projectKey=blkc-spiderfoot
sonar.projectName=SpiderFoot
sonar.projectVersion=1.0

# Source directory
sonar.sources=spiderfoot,modules
sonar.tests=test

# Python specific settings
sonar.language=py
sonar.python.version=3.12

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Security reports
sonar.python.bandit.reportPaths=bandit-report.json

# Exclusions
sonar.exclusions=**/test/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/.archive/**,**/migrations/**
sonar.coverage.exclusions=**/test/**,**/__pycache__/**

# Source encoding
sonar.sourceEncoding=UTF-8

# Host and authentication
sonar.host.url=https://sonar.blk.ing
sonar.token=${SONAR_TOKEN}
